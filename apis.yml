aid: harver
name: Harver
description: >-
  Harver is a Talent Intelligence platform for pre-employment assessment,
  automated interview scheduling and reference checking that helps organizations
  make data-driven, less-biased hiring decisions at scale. Harver's Public API
  (OpenAPI 3.0, v1.37.0) is available to Harver customers and lets ATS and HR
  systems submit candidates, create applications and magic-links, retrieve
  matching scores, module results and report links, manage vacancies, locations,
  regions and job functions, and subscribe to candidate-lifecycle webhooks.
  Authentication is OAuth2 client_credentials; resources use a JSON:API-style
  envelope, responses are rate-limited (Ratelimit-Limit/Reset, 429) and carry an
  X-Correlation-Id. Harver was surfaced as an Insight Partners portfolio company.
