        description: ID of the Application to consider ([0-9a-f]{24})
        schema:
          type: string
      - in: query
        name: expiresIn
        required: true
        description: Link expiration time in seconds. Must be between 2 weeks (1209600) and 1 year (31536000).
        schema:
          type: integer
          minimum: 1209600
          maximum: 31536000
          example: 1209600
