      description: 'This endpoint returns a link to access the development report. The development report can be searched with the `applicationId` and `locale` query parameter.

        '
      tags:
      - applications
      parameters:
      - in: path
        name: applicationId
        required: true
        description: ID of the Application to consider ([0-9a-f]{24})
        schema:
          type: string
      - in: query
        name: locale
        description: The locales to consider
        schema:
          type: string
          enum:
          - en-US
          - nl-NL
          - de-DE
          - da-DK
          - en-GB
          - es-ES
          - fr-BE
          - fr-CA
          - fr-FR
          - pl-PL
          - pt-PT
        required: true
      responses:
        '200':
          description: Successfully fetched the link to access the file
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      link:
                        type: string
                        example: https://api.harver.com/api/v1.0/public/applications/application-id/reports/development-reports/base-64-encoded-string
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: ValidationError
                        status:
                          type: number
                          example: 400
                        title:
                          type: string
