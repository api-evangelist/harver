    patch:
      summary: Update an Application
      tags:
      - applications
      parameters:
      - in: path
        name: applicationId
        required: true
        description: ID of the Application to consider ([0-9a-f]{24})
        schema:
          type: string
      requestBody:
        description: The Application status to update
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attributes:
                  required:
                  - status
                  properties:
                    status:
                      type: string
                      enum:
                      - new
                      - in-progress
                      - rejected
                      - invited
                      - talent-pool
                      - hired
                      - shortlisted
                      - contract
                    message:
                      type: object
                      properties:
                        ENG:
                          type: object
                          properties:
                            mailTitle:
                              type: string
                            mailBody:
                              type: string
                        NL:
                          type: object
                          properties:
                            mailTitle:
                              type: string
