openapi: 3.2.0
info:
  version: 1.37.0
  title: Harver Public Applications API
  description: Public API of the Harver Platform available only for the Customers of Harver.
  contact:
    name: Harver Support Team
    email: support@harver.com
    url: https://support.harver.com
servers:
- url: https://api.harver.com/api/v1.0/
  description: Production Server
tags:
- name: Applications
paths:
  /applications:
    get:
      summary: Returns application ids
      description: 'Get harver application ids based on ats-parameters or search by vacancy and email.

        - filter[atsParameters]

        or

        - filter[applicationMeta]


        #### Important!!


        To improve the search of applications using atsParameters, the endpoint has been limited to search applications using standardized parameters only. Below is the list of standardized parameters.


        - application_id

        - candidate_id

        - country

        - id

        - location

        - source

        - vacancy_id


        Apart from these, harver provides another 5 customizable standard atsParameters. So the client can do a custom mapping from the client''s side and use these standard atsParameters for an application search.


        - custom_id_1

        - custom_id_2

        - custom_id_3

        - custom_id_4

        - custom_id_5


        #### Example query:

        To search an application based on atsCandidateId, you would call the following endpoint:


        curl -X GET \

        ''https://api.harver.com/api/v1.0/applications?accountId=:accountId&filter[atsParameters][atsCandidateId]=123456789&filter[atsParameters][atdVacancyId]=56254122'' \

        -H ''Authorization: Bearer ...''


        To search an application based on vacancy and email, you would call the following endpoint:


        curl -X GET \

        ''https://api.harver.com/api/v1.0/applications?accountId=:accountId&filter[applicationMeta][vacancy]=123456789&filter[applicationMeta][email]=email@test.com'' \

        -H ''Authorization: Bearer ...'''
      tags:
      - Applications
      parameters:
      - in: query
        name: accountId
        required: true
        description: The account to look for
        schema:
          type: string
      - in: query
        required: true
        name: filter
        description: The filter to apply
        schema:
          type: string
          enum:
          - atsParameters[candidateId]
          - atsParameters[srcId]
          - atsParameters[vacancyId]
          - applicationMeta[vacancy]
          - applicationMeta[email]
      responses:
        '200':
          description: Returns Application ids
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        id:
                          type: string
                        vacancyId:
                          type: string
      operationId: getApplications
      x-operation-id-source: derived
  /applications/{applicationId}:
    get:
      summary: Returns the details of an Application
      description: '### IMPORTANT

        Avoid using all the `include` criteria, unless all modules are enabled in your account. Use `include` criteria for the modules activated in your account.

        ## Retrieving relationship data

        To retrieve an Application''s relationship data (such as a PDF report, submitted resume etc.), you can make a basic GET `applications/{applicationId}`, while also providing the `include` parameter. This parameter represents ''a list of comma-separated includes'', which are to be included in the response.

        #### Supported includes:

        - `vacancy`

        - `report`

        - `cover-letter`

        - `resume`

        - `profile-photo`

        - `matching-results`

        - `video-pitches`

        - `video-interviews`

        - `personal-info`

        - `additional-info`

        - `grading`

        - `ats`

        - `open-questions`

        - `consents`

        - `application-locations`

        - `locations`

        - `availability`

        - `job-functions`

        - `diagnostics`

        - `location-specific-question`

        - `custom-document`

        - `virtual-interviews`

        - `matching-indicators`

        - `account-questions`

        - `personal-information`

        - `sessions`

        - `fraud-flags`

        - `smart-job-navigator`

        - `proctoring`

        #### Proctoring

        The `proctoring` include returns the candidate''s session-monitoring consent status and out-of-focus tab-switch count. It is only present in the response for vacancies that have Proctoring enabled (i.e. where the application contains a proctoring consent record). When consent is declined, `proctoringResults.outOfFocus.count` will be `null`.

        #### Report

        The report is shown in the GET Application response in the language in which the candidate has completed the flow. To get the content of the report in a specific language (if available), please specify the language in the request header `Accept-Language`. Please note that multiple language preferences are not supported. The language of the response content will be specified in the response header `Content-Language`.

        #### Personal and Additional Info

        When personal or additional info modules are included, attributes will have `questions` field as an array of questions, where each question has the following attributes:

        - `questionId(string)`

        - `question(string)`

        - `answer(mixed)`

        - `answerType(string)`

        For Retail Flow accounts, the personal-info include''s module type will be `Vacancy Questions`

        #### Personal Information (New Module)

        To get data from new personal information module, you need to add the include `personal-information`. Schema example is added in the response samples.

        #### NOTE: `smart-job-navigator` include returns data only when the application status is not `in progress` .

        #### Example query:

        To fetch an application with the ID `5bd17c67c081252955b19659` and include `matching-results` and `ats` information in the response, you would call the following endpoint:


        curl -X GET \

        ''https://api.harver.com/api/v1.0/applications/5bd17c67c081252955b19659?include=matching-results,ats'' \

        -H ''Authorization: Bearer ...''


        #### NOTE: `open-questions` include will be deprecated, please use `open-question` instead.'
      tags:
      - Applications
      parameters:
      - in: path
        name: applicationId
        required: true
        description: ID of the Application to consider ([0-9a-f]{24})
        schema:
          type: string
      - in: query
        name: include
