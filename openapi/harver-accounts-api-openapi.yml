  /accounts/{accountId}/jobboard:
    get:
      summary: Returns Job board details
      description: "To obtain the list of Job board vacancies and their locations and job-functions details, perform a `GET` operation to the `/accounts/<account-id>/jobboard` endpoint.\n### Limiting results\nOptionally, to limit the scope of the results, you can use the following [query parameters](https://en.wikipedia.org/wiki/Query_string):\n- `filter[vacancy]`\n- `filter[language]`\n\nFor filtering by language, comma separated values can be used. Ex: `?filter[language]=<language1>,<language2>`\n#### Example query:\nTo fetch all job board vacancies of account `<testAccountId>`, you would call the following endpoint:\n\n    curl -X GET \\\n      'https://api.harver.com/api/v1.0/accounts/<testAccountId>/jobboard' \\\n      -H 'Authorization: Bearer ...'\nTo fetch a specific vacancy of the job board in account `<testAccountId>`, you would call the following endpoint:\n\n    curl -X GET \\\n      'https://api.harver.com/api/v1.0/accounts/<testAccountId>/jobboard?filter[vacancy]=<testVacancyId>' \\\n      -H 'Authorization: Bearer ...'\nTo fetch a specific vacancy of the job board in account `<testAccountId>` and filter by language `ENG`, you would call the following endpoint:\n\n    curl -X GET \\\n      'https://api.harver.com/api/v1.0/accounts/<testAccountId>/jobboard?filter[vacancy]=<testVacancyId>&filter[language]=EN' \\\n      -H 'Authorization: Bearer ...'\nTo fetch a specific vacancy of the job board in account `<testAccountId>` and filter by language `ENG` and `NL`, you would call the following endpoint:\n\n    curl -X GET \\\n      'https://api.harver.com/api/v1.0/accounts/<testAccountId>/jobboard?filter[vacancy]=<testVacancyId>&filter[language]=ENG,NL' \\\n      -H 'Authorization: Bearer ...'\n"
      tags:
      - accounts
      parameters:
      - in: path
        name: accountId
        schema:
          type: string
        required: true
        description: ID of the Account to consider
      - in: query
        name: filter
        description: Vacancy and Location filter
        schema:
          type: object
          properties:
            vacancy:
              type: string
            language:
              type: string
              enum:
              - ENG
              - NL
              - DE
              - FR
              - IT
              - ES
      responses:
        '200':
          description: Vacancies in job board
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                - included
                properties:
                  data:
                    type: array
                    items:
                      properties:
                        type:
                          type: string
                          example: jobboard
                        id:
                          type: string
                        attributes:
                          type: object
                          properties:
                            language:
                              type: string
                              example: ENG
                            link:
                              type: string
                            title:
                              type: string
                            description:
                              type: string
                        relationships:
                          type: object
                          properties:
                            location:
                              type: object
                              properties:
                                data:
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                      example: locations
                                    id:
                                      type: string
                            jobFunction:
                              type: object
                              properties:
                                data:
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                      example: job-functions
                                    id:
                                      type: string
                            vacancy:
                              type: object
                              properties:
                                data:
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                      example: vacancies
                                    id:
                                      type: string
                  included:
                    type: array
                    items:
                      allOf:
                      - type: object
                        properties:
                          type:
                            type: string
                            example: locations
                          id:
                            type: string
                          attributes:
                            type: object
                            properties:
                              name:
                                type: string
                              address:
                                type: string
                              addressDetails:
                                type: object
                                properties:
                                  country:
                                    type: string
                                  state:
                                    type: string
                                  postalCode:
                                    type: string
                                  city:
                                    type: string
                                  street:
                                    type: string
                                  streetNumber:
                                    type: string
                                  latitude:
                                    type: string
                                  longitude:
                                    type: string
                              externalId:
                                type: string
                      - type: object
                        properties:
                          type:
                            type: string
                            example: job-functions
                          id:
                            type: string
                          attributes:
                            type: object
                            properties:
                              title:
                                type: string
                      - type: object
                        properties:
                          type:
                            type: string
                            example: vacancies
                          id:
                            type: string
                          attributes:
                            type: object
                            properties:
                              name:
                                type: string
