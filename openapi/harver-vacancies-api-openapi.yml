  /vacancies/{vacancyId}/locations-v2:
    patch:
      summary: Updates attached locations of a vacancy
      description: "\nThis endpoint updates the attached locations of a vacancy. It supports two configs to manipulate location update.\n- `forceOperation` - This option accepts boolean value `true` or `false`. \n\n    -  If set to `true`, it will attach sent locations to the job vacancy, EVEN IF there are already regions attached to it.\n\n    -  If set to `false`, will verify if the job vacancy already has regions attached. If regions are already attached, an error response is sent.\n\n- `replaceValues` - This option accepts boolean value `true` or `false`.\n\n    -  If set to `true`, the new locations will completely replace any existing ones in the vacancy.\n    \n    -  If set to `false`, the new locations will be added alongside the existing ones, creating a combined list of locations and attaching them to the vacancy.\n"
      tags:
      - vacancies
      parameters:
      - in: path
        name: vacancyId
        schema:
          type: string
        required: true
        description: ID of the Vacancy to consider
      requestBody:
        description: The Vacancy status to update
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attributes:
                  properties:
                    locations:
                      type: array
                      items:
                        type: string
                      example:
                      - 621f456062c05d000825b694
                      - 621f456062c05d000825b695
                      - 621f456062c05d000825b696
                    forceOperation:
                      type: boolean
                      example: false
                    replaceValues:
                      type: boolean
                      example: false
      responses:
        '200':
          description: Successfully updated the locations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
