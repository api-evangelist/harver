overlay: 1.0.0
info:
  title: API Evangelist enhancements for Harver Public API
  version: 1.0.0
extends: openapi/harver-openapi-original.json
actions:
- target: $.info
  update:
    x-apievangelist-enriched: '2026-07-19'
    x-apievangelist-auth: oauth2-client-credentials
    x-apievangelist-environments:
      production: https://api.harver.com
      test: https://api.harver-test.com
- target: $.info
  update:
    x-apievangelist-notes: >-
      Public API is available only to Harver customers; client_id/client_secret
      are provisioned per environment. Resources use a JSON:API-style envelope;
      errors use a custom {statusCode,status,code,message,name} JSON envelope;
      rate limiting is signaled via Ratelimit-Limit / Ratelimit-Reset with 429.
- target: $.info
  update:
    x-apievangelist-compliance: [ISO 27001, SOC 2 Type 2, GDPR, CCPA, NYC Local Law 144]
