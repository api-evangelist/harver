  description: Holds all company-specific configuration; users manage settings, vacancies and flows.
  path: /accounts/{accountId}
- name: Vacancy
  description: An open position within an Account; always connected to a Flow.
  path: /vacancies/{vacancyId}
- name: Flow
  description: An ordered set of assessment modules and content connected to one or more Vacancies.
  path: null
- name: Module
  description: A component of a Flow (personal-info form, personality questionnaire, multitasking test, etc.).
  path: /vacancies/{vacancyId}/modules/{moduleId}
- name: Candidate
  description: A person who applied to one or more Vacancies.
  path: /accounts/{accountId}/candidates/{candidateId}
- name: Application
  description: Created when a Candidate applies to a Vacancy; carries status, progress, matching score and reports.
  path: /applications/{applicationId}
- name: Location
  description: A physical location within an Account (also addressable by external location id).
  path: /accounts/{accountId}/locations/{locationId}
- name: Region
  description: A grouping of locations within an Account.
  path: /accounts/{accountId}/regions/{regionId}
- name: JobFunction
  description: A job function defined within an Account.
  path: /accounts/{accountId}/job-functions
- name: User
  description: A user profile within an Account.
  path: /accounts/{accountId}/users/{userProfileId}
- name: Note
  description: A note attached to an Application.
  path: /applications/{applicationId}/notes/{noteId}
